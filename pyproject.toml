[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "lancedb>=0.10",
    "pyarrow>=14",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=2.7"]

[project.scripts]
meridian = "meridian.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian*"]
