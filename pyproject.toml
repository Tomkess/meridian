[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.6.0"
# Upper-bounded: lancedb 0.19.0's native extension segfaults (SIGSEGV) on
# Python 3.14. Lift the <3.14 cap once lancedb ships a 3.14-compatible wheel.
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    # lancedb: pin to a tested range — its internal query API changes between minor versions
    "lancedb>=0.10,<0.20",
    "pyarrow>=14",
    # FEAT-013: correct TOML serialisation for the project registry. Hand-rolled
    # escaping missed control characters, and one newline made the file
    # unparseable — after which the next write silently deleted every project.
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# A real user-facing option — `pip install meridian[rerank]` — so it stays an extra.
rerank = ["sentence-transformers>=2.7"]

[dependency-groups]
# PEP 735. Dev tooling is not part of the installable package, so it does not
# belong in optional-dependencies: `uv sync` installs this by default and
# `uv build` ignores it.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "packaging>=23",   # dependency-bounds test (tests/test_dependency_bounds.py)
]

[project.scripts]
meridian = "meridian.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["meridian*"]

[tool.setuptools.package-data]
meridian = [
    "skills/commands/*.md",
    "skills/templates/*.md",
]

# P3: static analysis config — run with `ruff check .` and `mypy meridian/`
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
# strict = true  # enable incrementally as type coverage grows

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
