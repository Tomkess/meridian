name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # ── Layer 1: static analysis ────────────────────────────────────────── #

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy meridian/

      # ── Layer 2: behavioral tests (includes contract check) ─────────────── #

      - name: Test
        run: pytest tests/ -q --tb=short
        # Ollama and Databricks are absent in CI — tests that depend on them
        # are mocked or assert graceful failure (no traceback), so all 239
        # tests pass without external services.
