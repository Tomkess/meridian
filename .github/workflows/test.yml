name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      # ── Layer 1: static analysis ────────────────────────────────────────── #

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy meridian/

      # ── Skill-consistency: bundled ↔ .claude/commands/meridian drift ────── #
      # Exercises the FEAT-003 `--compare` CLI directly (model-free). The
      # runtime `--skill` twice-over mode needs a live model and runs
      # interactively, not in CI.

      - name: Skill structural drift (skill_consistency --compare)
        run: |
          rc=0
          for f in meridian/skills/commands/*.md; do
            b="$(basename "$f")"
            python scripts/skill_consistency.py --compare "$f" ".claude/commands/meridian/$b" \
              || { echo "::error file=.claude/commands/meridian/$b::structural drift vs bundled skill"; rc=1; }
          done
          exit $rc

      # ── Layer 2: behavioral tests (includes contract check) ─────────────── #

      - name: Test
        run: pytest tests/ -q --tb=short
        # Ollama and Databricks are absent in CI — tests that depend on them
        # are mocked or assert graceful failure (no traceback), so all 239
        # tests pass without external services.
